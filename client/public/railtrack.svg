<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Orange Arch -->
  <path d="M 8 44 A 24 24 0 0 1 56 44" fill="none" stroke="#F39C12" stroke-width="4" stroke-linecap="round" />
  
  <!-- Tracks -->
  <g fill="#2C3E50">
    <!-- Left track lines -->
    <polygon points="26,48 4,62 9,62 28,48" />
    <polygon points="28,48 14,62 17,62 30,48" />
    <!-- Right track lines -->
    <polygon points="38,48 60,62 55,62 36,48" />
    <polygon points="36,48 50,62 47,62 34,48" />
    <!-- Sleepers -->
    <polygon points="23,51 41,51 42,52 22,52" />
    <polygon points="17,55 47,55 48,56.5 16,56.5" />
    <polygon points="9,60 55,60 56,62 8,62" />
  </g>

  <!-- Train Body Base -->
  <path d="M 22 22 C 22 14, 42 14, 42 22 L 46 48 L 18 48 Z" fill="#ECF0F1" stroke="#2C3E50" stroke-width="1.5" />

  <!-- Lower Body -->
  <path d="M 19.5 38 L 44.5 38 L 46 48 L 18 48 Z" fill="#2C3E50" />
  
  <!-- Bumper detail -->
  <polygon points="18,48 46,48 48,50 16,50" fill="#34495E" />

  <!-- Windshield -->
  <path d="M 23.5 22 C 23.5 17, 40.5 17, 40.5 22 L 42.5 32 L 21.5 32 Z" fill="#2C3E50" />
  <!-- Windshield reflection -->
  <path d="M 24.5 23 C 24.5 19, 39.5 19, 39.5 23 L 40.5 27 L 23.5 27 Z" fill="#7F8C8D" opacity="0.5" />

  <!-- Gray stripe -->
  <polygon points="21,33 43,33 43.5,35 20.5,35" fill="#BDC3C7" />
  
  <!-- Lights -->
  <!-- Top Center -->
  <circle cx="32" cy="18" r="1.5" fill="#F1C40F" />
  <!-- Bottom Left -->
  <rect x="22" y="41" width="5" height="3" rx="1.5" fill="#FFFFFF" />
  <!-- Bottom Right -->
  <rect x="37" y="41" width="5" height="3" rx="1.5" fill="#FFFFFF" />
  <!-- Bottom Center -->
  <rect x="30" y="42" width="4" height="2" rx="1" fill="#F39C12" />
  
  <!-- Small side windows -->
  <path d="M 19 25 L 21 25 L 20 32 L 18 32 Z" fill="#2C3E50" />
  <path d="M 45 25 L 43 25 L 44 32 L 46 32 Z" fill="#2C3E50" />
</svg>
