name: RailAware CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run dependency audit
      run: npm audit || true
      
    - name: Audit High/Critical only
      run: npm audit --audit-level=high

    - name: Lint Server & Client
      run: |
        npm run lint --prefix server || true
        npm run lint --prefix client

    - name: Build Client
      run: npm run build --prefix client

    - name: Run Backend Tests & Coverage
      run: npm run test --prefix server -- --coverage

    - name: Run Frontend Tests & Coverage (including a11y)
      run: npm run test --prefix client

    - name: Run Playwright E2E Tests
      run: |
        cd client
        npx playwright install --with-deps
        npx playwright test
        
    - name: Upload Backend Coverage
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: backend-coverage
        path: server/coverage/
        retention-days: 7

    - name: Upload Frontend Coverage
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: frontend-coverage
        path: client/coverage/
        retention-days: 7
        
    - name: Upload Playwright Report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: playwright-report
        path: client/playwright-report/
        retention-days: 7
