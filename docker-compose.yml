version: '3.8'

services:
  api:
    image: node:20-alpine
    working_dir: /app/server
    volumes:
      - ./server:/app/server
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongo:27017/railaware
    env_file:
      - .env
    command: npm run dev
    depends_on:
      - mongo

  web:
    image: node:20-alpine
    working_dir: /app/client
    volumes:
      - ./client:/app/client
    ports:
      - "5173:5173"
    command: npm run dev -- --host
    environment:
      - VITE_API_URL=http://localhost:3001

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
